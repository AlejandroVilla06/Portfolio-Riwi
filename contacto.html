<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | Alejandro Villa</title>
    <meta name="description" content="Contacta a Alejandro Villa — AI Engineer en formación.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eef7ff',
                            100: '#d9edff',
                            200: '#bce0ff',
                            400: '#60b5ff',
                            500: '#3b9eff',
                            600: '#1a7ff5',
                            700: '#1366d9',
                            800: '#1654b0',
                            900: '#18478a',
                            950: '#0f2d5c',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-950 text-gray-200 font-sans">

    <header class="border-b border-gray-800">
        <nav class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <a href="index.html" class="text-xl font-bold text-white">AV<span class="text-brand-500">.</span></a>
            <div class="flex gap-6 text-sm font-medium">
                <a href="index.html" class="text-gray-400 hover:text-white transition">Home</a>
                <a href="proyectos.html" class="text-gray-400 hover:text-white transition">Proyectos</a>
                <a href="contacto.html" class="text-brand-400 hover:text-brand-300 transition">Contacto</a>
            </div>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-16">

        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-bold text-white mb-2">Contacto</h1>
            <p class="text-gray-400 mb-10">¿Tenés un proyecto, una idea o querés conversar? Escribime.</p>

            <form class="space-y-6">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-300 mb-2">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
                        placeholder="Tu nombre">
                </div>

                <div>
                    <label for="correo" class="block text-sm font-medium text-gray-300 mb-2">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
                        placeholder="tu@correo.com">
                </div>

                <div>
                    <label for="asunto" class="block text-sm font-medium text-gray-300 mb-2">Asunto</label>
                    <select id="asunto" name="asunto"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                        <option value="">Seleccioná un tema</option>
                        <option value="proyecto">Propuesta de proyecto</option>
                        <option value="colaboracion">Colaboración</option>
                        <option value="trabajo">Oportunidad laboral</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div>
                    <label for="mensaje" class="block text-sm font-medium text-gray-300 mb-2">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition resize-y"
                        placeholder="Contame en qué puedo ayudarte..."></textarea>
                </div>

                <button type="submit"
                    class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-lg transition">
                    Enviar mensaje
                </button>
            </form>

            <div class="mt-16 grid sm:grid-cols-3 gap-6 text-center">
                <a href="https://github.com/AlejandroVilla06" target="_blank" class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-brand-600 transition group">
                    <p class="text-2xl mb-2">💻</p>
                    <p class="font-semibold text-white group-hover:text-brand-400 transition">GitHub</p>
                    <p class="text-sm text-gray-500">@AlejandroVilla06</p>
                </a>
                <a href="https://www.linkedin.com/in/alejandro-villa-higuita-/" target="_blank" class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-brand-600 transition group">
                    <p class="text-2xl mb-2">🔗</p>
                    <p class="font-semibold text-white group-hover:text-brand-400 transition">LinkedIn</p>
                    <p class="text-sm text-gray-500">Alejandro Villa</p>
                </a>
                <a href="mailto:higuitav.alejandro@gmail.com" class="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-brand-600 transition group">
                    <p class="text-2xl mb-2">✉️</p>
                    <p class="font-semibold text-white group-hover:text-brand-400 transition">Email</p>
                    <p class="text-sm text-gray-500">higuitav.alejandro</p>
                </a>
            </div>
        </div>

    </main>

    <footer class="border-t border-gray-800 mt-8">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-gray-500">
            <p>&copy; 2026 Alejandro Villa</p>
            <div class="flex gap-6">
                <a href="https://github.com/AlejandroVilla06" target="_blank" class="hover:text-white transition">GitHub</a>
                <a href="https://www.linkedin.com/in/alejandro-villa-higuita-/" target="_blank" class="hover:text-white transition">LinkedIn</a>
                <a href="contacto.html" class="hover:text-white transition">Contacto</a>
            </div>
        </div>
    </footer>

</body>
</html>
